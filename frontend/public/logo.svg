<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)"/>
  
  <!-- Code Bracket Left -->
  <path d="M65 60 L45 80 L45 120 L65 140" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Code Bracket Right -->
  <path d="M135 60 L155 80 L155 120 L135 140" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- V Letter - Stylized -->
  <path d="M75 70 L100 130 L125 70" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Cursor/Caret -->
  <rect x="110" y="85" width="4" height="30" fill="#FCD34D" rx="2">
    <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Sparkle/AI indicator -->
  <circle cx="160" cy="50" r="8" fill="#FCD34D"/>
  <path d="M160 42 L160 58 M152 50 L168 50" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
